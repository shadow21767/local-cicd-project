<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Deployment Project</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .card {
            width: min(600px, 85%);
            padding: 40px;
            text-align: center;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #1f2937;
        }

        .success {
            color: #15803d;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Local Automated Deployment Pipeline</h1>

        <p class="success">
            Successfully deployed through Jenkins and Terraform!
        </p>

        <p>
            GitHub → Jenkins → Docker Build → Terraform → Docker Container
        </p>

        <p>Application Version: 1.0</p>
    </main>
</body>
</html>
